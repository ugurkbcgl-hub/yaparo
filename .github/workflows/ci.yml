name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  django-check:
    name: Django system check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: growthtwin_ci
          POSTGRES_USER: growthtwin_ci
          POSTGRES_PASSWORD: growthtwin-ci-only-placeholder-not-for-deployment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growthtwin_ci -d growthtwin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install application and development dependencies
        run: python -m pip install -e ".[dev,e2e]"

      - name: Bound Ubuntu dependency downloads
        working-directory: .
        timeout-minutes: 1
        run: |
          sudo tee /etc/apt/apt.conf.d/99growthtwin-ci-downloads > /dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' \
              'https://archive.ubuntu.com/ubuntu/' \
              'https://security.ubuntu.com/ubuntu/' \
              | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi

      - name: Install Chromium for the browser E2E test
        timeout-minutes: 8
        run: python -m playwright install --with-deps chromium

      - name: Set up Node for the isolated creative editor experiment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.1"

      - name: Install pinned creative editor dependency without install scripts
        working-directory: experiments/creative-editor
        timeout-minutes: 3
        run: |
          npm ci --ignore-scripts --omit=optional --no-fund
          npm audit --omit=optional --audit-level=high

      - name: Check isolated editor formatting and offline browser workflow
        working-directory: .
        timeout-minutes: 2
        run: |
          python -m ruff format --check --config apps/web/pyproject.toml experiments/creative-editor/serve.py experiments/creative-editor/test_editor.py
          python -m ruff check --config apps/web/pyproject.toml experiments/creative-editor/serve.py experiments/creative-editor/test_editor.py
          python experiments/creative-editor/test_editor.py

      - name: Check research decision studio without provider access
        working-directory: .
        timeout-minutes: 2
        run: |
          node experiments/decision-studio/engine.test.cjs
          node experiments/decision-studio/brief-flow.test.cjs
          node experiments/decision-studio/first-stage-bank.test.cjs
          node --check experiments/decision-studio/dist/first-stage-ui.js
          node --check experiments/decision-studio/dist/first-stage-bridge.js
          node experiments/decision-studio/v2-flow.test.cjs
          node --check experiments/decision-studio/dist/v2-app.js
          node experiments/decision-studio/production.test.cjs
          node experiments/decision-studio/simulation.test.cjs
          python experiments/decision-studio/test_sources.py
          node --check experiments/decision-studio/dist/app.js
          python -m ruff format --check --config apps/web/pyproject.toml experiments/decision-studio
          python -m ruff check --config apps/web/pyproject.toml experiments/decision-studio
          python experiments/decision-studio/check.py
          python experiments/decision-studio/first_stage_check.py

      - name: Compare pinned typed output without model access
        working-directory: .
        timeout-minutes: 3
        run: |
          python -m ruff format --check --config apps/web/pyproject.toml experiments/typed-output
          python -m ruff check --config apps/web/pyproject.toml experiments/typed-output
          python experiments/typed-output/run.py

      - name: Verify Heroku root dependencies and entry point
        working-directory: .
        run: python -m pip install -r requirements.txt

      - name: Check root Heroku entry point formatting and lint
        working-directory: .
        run: |
          python -m ruff format --check --config apps/web/pyproject.toml manage.py
          python -m ruff check --config apps/web/pyproject.toml manage.py

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Lint Python
        run: python -m ruff check .

      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --skip-editable --progress-spinner off

      - name: Build and verify Python distributions
        run: |
          python -m build --sdist --wheel
          python scripts/verify_build_artifacts.py

      - name: Verify Heroku entry point and static asset build
        working-directory: .
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-not-for-deployment-use-random-key-123456789
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: staging.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://staging.example.test
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_COOKIES: "true"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
          DATABASE_URL: postgres://growthtwin_ci@127.0.0.1:5432/growthtwin_ci
        run: |
          python manage.py check --deploy
          python manage.py collectstatic --noinput

      - name: Run Django system check
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-not-for-deployment
          POSTGRES_DB: growthtwin_ci
          POSTGRES_USER: growthtwin_ci
          POSTGRES_PASSWORD: growthtwin-ci-only-placeholder-not-for-deployment
          POSTGRES_HOST: 127.0.0.1
        run: python manage.py check

      - name: Check migrations are up to date
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-not-for-deployment
          POSTGRES_DB: growthtwin_ci
          POSTGRES_USER: growthtwin_ci
          POSTGRES_PASSWORD: growthtwin-ci-only-placeholder-not-for-deployment
          POSTGRES_HOST: 127.0.0.1
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-not-for-deployment
          POSTGRES_DB: growthtwin_ci
          POSTGRES_USER: growthtwin_ci
          POSTGRES_PASSWORD: growthtwin-ci-only-placeholder-not-for-deployment
          POSTGRES_HOST: 127.0.0.1
        run: python manage.py test

      - name: Run browser end-to-end tests
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-not-for-deployment
          POSTGRES_DB: growthtwin_ci
          POSTGRES_USER: growthtwin_ci
          POSTGRES_PASSWORD: growthtwin-ci-only-placeholder-not-for-deployment
          POSTGRES_HOST: 127.0.0.1
        run: python manage.py test e2e
