[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaparo-web"
version = "0.1.0"
description = "Yaparo self-service advertising website"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "dj-database-url>=2.3,<4",
    "gunicorn>=25,<26",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "pip-audit==2.10.1",
    "ruff==0.16.9",
]
e2e = [
    "playwright==1.63.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["build/**", "dist/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "growthtwin*"]

[tool.setuptools.package-data]
"growthtwin.demo" = [
    "templates/demo/*.html",
    "templates/registration/*.html",
]
"growthtwin.site" = [
    "templates/site/*.html",
    "static/site/css/*.css",
    "static/site/js/*.js",
]
"growthtwin.modules.campaigns" = [
    "templates/campaigns/*.html",
    "static/campaigns/css/*.css",
    "static/campaigns/js/*.js",
]
"growthtwin.modules.connections" = ["templates/connections/*.html"]
"growthtwin.modules.workspaces" = [
    "templates/workspaces/*.html",
    "static/workspaces/css/*.css",
    "static/workspaces/js/*.js",
    "static/workspaces/vendor/*.js",
    "static/workspaces/vendor/*.txt",
]
